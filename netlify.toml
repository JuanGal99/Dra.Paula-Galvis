[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Quien tiene el navegador en español pasa a /es/ desde el servidor, sin esperar a que cargue la página.
# La cookie nf_lang, que guardan las banderas del menú, tiene prioridad sobre el idioma del navegador.
[[redirects]]
  from = "/"
  to = "/es/"
  status = 302
  force = true
  conditions = { Language = ["es"] }

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Los archivos de /assets llevan un hash en el nombre: cambian de nombre al cambiar
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
